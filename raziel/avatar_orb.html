<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raziel</title>
<!--
  avatar_orb.html - Raziel as a living orb of glowing particles.

  Shown by avatar_window.py when config.AVATAR_STYLE = "orb". Talks to the voice
  loop over the same websocket as avatar.html (avatar_server.py, port 8765):

    state      idle | listening | thinking | speaking   ("idle" = asleep, waiting for "Raziel")
    emotion    neutral happy amused sad concerned focused surprised angry confident
    visemes    her lip-sync timeline -> the orb pulses and sends out rings as she talks
    form       orb dragon sword knight butterfly planet heart galaxy universe
    universe   her universe of beings (universes.py): names, colours, symbols, which one is working ("focus")
    action     roar fire fly stay swing attack block raise   (switches to the right form first)
    music      48 frequency bands of whatever the PC is playing (music_listener.py)

  Backgrounds:
    avatar_orb.html            see-through window (AVATAR_TRANSPARENCY = "native"). Every pixel is
                               either fully see-through or fully drawn, because the window's
                               see-through trick (a colour key) can't blend soft edges. So she lives
                               inside a glass sphere: everything inside it is fully drawn and can be
                               soft (glow, stars, trails, reflections); only its outline is a hard edge.
    avatar_orb.html?look=float the old see-through look: bare particles, no sphere, no soft glow
                               (AVATAR_ORB_LOOK = "float").
    avatar_orb.html?bg=0d1017  opaque dark tile ("none"): full soft glow, stars, trails.
  Other URL options: ?n=16000 particle count (fewer = lighter on the CPU).

  Nothing is loaded from the internet (no libraries, no fonts) except the album art of the song
  Spotify is playing, on the music card.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { user-select: none; -webkit-user-select: none; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  canvas.cutout { image-rendering: pixelated; }   /* never blend a see-through pixel into a drawn one */
  /* Mini cards under the orb (cards.py). Each card is a rounded glass pill painted on #cardbg; in the
     see-through window every pixel of it is fully drawn or fully clear (the pill's outline is snapped to
     whole pixels), so there are no shadows or fades outside it. Every size / position is a multiple of
     4 CSS px (a whole number of screen pixels at 100 / 125 / 150 / 175 / 200 % scaling). */
  #ulabels { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #cardbg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
  #cards { position: fixed; inset: 0; pointer-events: none; }
  .card { position: absolute; box-sizing: border-box; background: transparent; color: #eef2ff;
          font: 13px/16px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; display: flex;
          align-items: center; gap: 9px; padding: 0 14px; white-space: nowrap; }
  .card .ic { font-size: 20px; line-height: 24px; flex: none; width: 24px; text-align: center; }
  .card .main { flex: 1; min-width: 0; }
  .card .t1 { font-weight: 600; font-size: 13px; letter-spacing: 0.1px; overflow: hidden; text-overflow: ellipsis; }
  .card .t2 { color: #9aabd6; font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
  .card .big { font: 600 23px/28px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
               font-variant-numeric: tabular-nums; letter-spacing: -0.5px; flex: none; }
  .card .bar { position: absolute; left: 16px; right: 16px; bottom: 7px; height: 3px; border-radius: 2px; background: #1c2742; overflow: hidden; }
  .card .bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, #58b8ff, #8fe6ff); }
  .card img { width: 44px; height: 44px; flex: none; object-fit: cover; border-radius: 8px; background: #1a2338; }
  .card.music { padding-left: 10px; }
  .card.note { align-items: flex-start; padding-top: 12px; }
  .card.note .t2 { white-space: normal; max-height: 32px; }
  .card.status { font-size: 12px; color: #c3cff2; gap: 8px; padding: 0 14px; }
  .card.status .ic { font-size: 14px; width: 18px; }
  .card.status .t1 { font-weight: 500; font-size: 12.5px; }
  .card.hold { gap: 10px; }
  .card.hold .t1 { font-weight: 500; }
  .card.hold .bar { bottom: 6px; }
  .card.hold .bar i { background: linear-gradient(90deg, #7fd8ff, #ffffff); }
  .card.done .bar i { background: linear-gradient(90deg, #58c86a, #9ef08a); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #9aa6d8;
          font: 13px/1.4 system-ui, "Segoe UI", sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Raziel"></canvas>
<canvas id="ulabels"></canvas>
<canvas id="cardbg"></canvas>
<div id="cards"></div>
<div id="nogl">This window can&rsquo;t show WebGL, which the particles need.<br>Set AVATAR_STYLE = "vrm" in config.py to use the 3D avatar instead.</div>
<script>
(() => {
'use strict';

// ================================================================ helpers
const TAU = Math.PI * 2;
const GA = Math.PI * (3 - Math.sqrt(5));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const fract = x => x - Math.floor(x);
const wrapAng = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = REDUCED ? 0.5 : 1;

function rotMat(yaw, pitch, roll) {        // R = Ry(yaw) * Rx(pitch) * Rz(roll), row-major
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), cr = Math.cos(roll), sr = Math.sin(roll);
  const rz = v => [cr * v[0] - sr * v[1], sr * v[0] + cr * v[1], v[2]];
  const rx = v => [v[0], cp * v[1] - sp * v[2], sp * v[1] + cp * v[2]];
  const ry = v => [cy * v[0] + sy * v[2], v[1], -sy * v[0] + cy * v[2]];
  const c = [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map(v => ry(rx(rz(v))));
  return [c[0][0], c[1][0], c[2][0], c[0][1], c[1][1], c[2][1], c[0][2], c[1][2], c[2][2]];
}
function applyMat(f, m, s, tx, ty, tz, from = 0, to = N) {
  const X = f.x, Y = f.y, Z = f.z;
  for (let i = from; i < to; i++) {
    const x = X[i] * s, y = Y[i] * s, z = Z[i] * s;
    X[i] = m[0] * x + m[1] * y + m[2] * z + tx;
    Y[i] = m[3] * x + m[4] * y + m[5] * z + ty;
    Z[i] = m[6] * x + m[7] * y + m[8] * z + tz;
  }
}
function xf(m, s, t, p) {
  const x = p[0] * s, y = p[1] * s, z = p[2] * s;
  return [m[0] * x + m[1] * y + m[2] * z + t[0], m[3] * x + m[4] * y + m[5] * z + t[1], m[6] * x + m[7] * y + m[8] * z + t[2]];
}
function counts(fracs) {                   // splits N particles by fractions; the last part takes the rest
  const out = []; let used = 0;
  fracs.forEach((f, i) => { const n = i === fracs.length - 1 ? N - used : Math.floor(N * f); out.push(n); used += n; });
  return out;
}

// ================================================================ page options (set by avatar_window.py)
const PARAMS = new URLSearchParams(location.search);
const BG_HEX = (PARAMS.get('bg') || '').replace(/[^0-9a-fA-F]/g, '');
const OPAQUE = BG_HEX.length === 6;                     // ?bg=0d1017 -> dark tile; otherwise see-through
const BG_RGB = OPAQUE ? [0, 2, 4].map(i => parseInt(BG_HEX.slice(i, i + 2), 16) / 255) : [0, 0, 0];
const N = clamp(parseInt(PARAMS.get('n'), 10) || 24000, 4000, 60000);
const WS_URL = 'ws://127.0.0.1:' + (parseInt(PARAMS.get('ws'), 10) || 8765);
// See-through window: she lives inside a glass sphere (?look=sphere, the default) - its inside is fully
// drawn, so it gets the full soft glow, stars and trails - or floats free as bare particles (?look=float).
const SPHERE = !OPAQUE && (PARAMS.get('look') || 'sphere').toLowerCase() !== 'float';
if (OPAQUE) { document.documentElement.style.background = document.body.style.background = '#' + BG_HEX; }

// ================================================================ her state, driven by avatar_server.py
// The nine emotions emotion.py / avatar_server.py use, as colours.
const MOODS = {
  neutral:   [0.45, 0.82, 1.00],   // her own cyan
  happy:     [1.00, 0.76, 0.36],   // warm gold
  amused:    [1.00, 0.56, 0.82],   // playful pink
  sad:       [0.42, 0.52, 1.00],   // deep blue
  concerned: [0.68, 0.60, 1.00],   // soft lavender
  focused:   [0.40, 1.00, 0.86],   // mint
  surprised: [1.00, 0.94, 0.58],   // bright flash
  angry:     [1.00, 0.38, 0.32],   // ember red
  confident: [0.76, 0.90, 1.00],   // icy white-blue
};
const THINK_RGB = [0.74, 0.52, 1.00];
const SLEEP_AFTER = 1.5;           // "idle" between two sentences is not sleep; only an idle that lasts is

const sim = {
  time: 0,
  raw: 'idle',                     // what Raziel last said her state was
  state: 'asleep',                 // what the orb shows: asleep | listening | thinking | speaking
  sleepAt: 0,
  mood: 'neutral', moodK: 1, moodAt: 0,
  awake: 0, think: 0,
  rings: [], lastRing: -1,
};

function setRawState(s) {
  if (!['idle', 'listening', 'thinking', 'speaking'].includes(s)) return;
  sim.raw = s;
  if (s === 'idle') {
    // Asleep straight away if she already was (page load); otherwise only if it lasts.
    sim.sleepAt = sim.state === 'asleep' ? sim.time : sim.time + SLEEP_AFTER;
    if (sim.state === 'speaking') { sim.state = 'listening'; sim.moodAt = sim.time; }
  } else {
    if (sim.state === 'speaking' && s !== 'speaking') sim.moodAt = sim.time;
    sim.state = s;
  }
}
function setMood(name, intensity) {
  const key = String(name || 'neutral').toLowerCase();
  sim.mood = MOODS[key] ? key : 'neutral';
  sim.moodK = clamp(intensity == null ? 1 : +intensity || 0, 0, 1);
  sim.moodAt = sim.time;
  if (sim.mood === 'surprised' && sim.awake > 0.5) addRing(trans ? trans.to.focus : [0, 0, 0], 0.7);
}

function addRing(center, strength) {
  sim.rings.push({ r: 0, a: strength, c: center.slice() });
  if (sim.rings.length > 4) sim.rings.shift();
}

// ================================================================ her voice: lip-sync timeline -> pulses
// speaker.py sends the Piper phoneme timing of every sentence ("visemes"). Each vowel becomes a
// syllable-shaped pulse; strong ones send a ring out of the orb.
const VOWEL_OPEN = { aa: 1.0, oh: 0.85, ou: 0.7, ee: 0.62, ih: 0.55 };
const voice = { tl: [], t0: 0, idx: 0, end: 0, level: 0, ext: 0, rnd: { level: 0, sylStart: 0, sylEnd: 0, gapUntil: 0, peak: 0 } };

function setTimeline(seq) {
  const tl = [];
  for (const it of Array.isArray(seq) ? seq : []) {
    if (!it || typeof it !== 'object') continue;
    const t = +(it.t ?? it.time ?? 0), d = +(it.d ?? it.duration ?? 0.09), w = +(it.w ?? 1);
    if (!isFinite(t) || !isFinite(d)) continue;
    tl.push({ t: Math.max(0, t), d: clamp(d, 0.03, 0.6), p: (VOWEL_OPEN[it.v || it.viseme] || 0.6) * clamp(isFinite(w) ? w : 1, 0, 1.4) });
  }
  tl.sort((a, b) => a.t - b.t);
  voice.tl = tl; voice.t0 = sim.time; voice.idx = 0;
  voice.end = tl.length ? tl[tl.length - 1].t + tl[tl.length - 1].d : 0;
}
function randomSyllables(v, now, active, onSyllable) {          // when there is no timing to follow
  if (!active) { v.level = approach(v.level, 0, 20, 1 / 60); return; }
  if (now >= v.sylEnd && now >= v.gapUntil) {
    const dur = 0.11 + Math.random() * 0.17;
    v.sylStart = now; v.sylEnd = now + dur;
    v.peak = 0.45 + Math.random() * 0.55;
    const r = Math.random();
    v.gapUntil = v.sylEnd + (r < 0.12 ? 0.28 + Math.random() * 0.25 : r < 0.45 ? 0.05 + Math.random() * 0.08 : 0);
    if (onSyllable) onSyllable(v.peak);
  }
  v.level = now < v.sylEnd && v.sylEnd > v.sylStart ? v.peak * Math.pow(Math.max(0, Math.sin(Math.PI * (now - v.sylStart) / (v.sylEnd - v.sylStart))), 0.7) : 0;
}
function stepVoice(dt, onSyllable) {
  const speaking = sim.state === 'speaking';
  const rel = sim.time - voice.t0;
  let lvl = 0;
  if (speaking && voice.tl.length && rel <= voice.end + 0.25) {
    const tl = voice.tl;
    while (voice.idx < tl.length && tl[voice.idx].t + tl[voice.idx].d < rel) voice.idx++;
    for (let j = voice.idx; j < tl.length && tl[j].t <= rel; j++) {
      const it = tl[j], u = (rel - it.t) / it.d;
      if (u >= 0 && u <= 1) {
        lvl = Math.max(lvl, it.p * Math.pow(Math.sin(Math.PI * u), 0.7));
        if (!it.fired) { it.fired = true; onSyllable(it.p); }
      }
    }
    voice.rnd.level = 0;
  } else {
    randomSyllables(voice.rnd, sim.time, speaking, onSyllable);
    lvl = voice.rnd.level;
  }
  voice.ext = approach(voice.ext, 0, 6, dt);
  voice.level = Math.max(lvl, voice.ext);
}

// ================================================================ music, heard by music_listener.py
// Python sends 48 log-spaced bands (30 Hz - 14 kHz) as bytes, scaled exactly like the Web Audio
// analyser the preview used, about 30 times a second while something is playing.
const BANDS = 48;
const music = {
  bytes: new Float32Array(BANDS), bands: new Float32Array(BANDS), wave: new Float32Array(128), waveIn: null,
  energy: 0, bass: 0, beat: 0, lastBeat: -1, bassAvg: 0, energyAvg: 0, bassSlow: 0, intensity: 0,
  period: 0, on: false, lastMsg: -9, active: false, activeFor: 0, react: true, sim: false, simT: 0,
};
function onMusic(msg) {
  music.lastMsg = sim.time;
  music.on = !!msg.on && music.react;
  if (!music.on) { music.bytes.fill(0); return; }
  const b = msg.b || msg.bands;
  if (Array.isArray(b)) for (let k = 0; k < BANDS; k++) music.bytes[k] = clamp(+b[Math.floor(k * b.length / BANDS)] || 0, 0, 255);
  if (Array.isArray(msg.w) && msg.w.length > 1) music.waveIn = msg.w.map(x => clamp(+x || 0, -128, 127) / 128);
}
function analyseMusic(dt) {
  const b = music.bands;
  let live = music.on && sim.time - music.lastMsg < 0.7;
  if (live) {
    for (let k = 0; k < BANDS; k++) {
      const v = Math.pow(music.bytes[k] / 255, 1.4) * (1 + k / BANDS * 0.8);
      b[k] = v > b[k] ? v : approach(b[k], v, 7, dt);
    }
    const w = music.waveIn;
    if (w) for (let k = 0; k < 128; k++) { const f = k / 127 * (w.length - 1), j = Math.min(w.length - 2, f | 0), u = f - j; music.wave[k] = approach(music.wave[k], lerp(w[j], w[j + 1], u), 18, dt); }
    else for (let k = 0; k < 128; k++) music.wave[k] = Math.sin(k * 0.3 + sim.time * 9) * (0.15 + music.bass * 0.5) + Math.sin(k * 1.1 - sim.time * 5) * 0.1 * music.energy;
  } else if (music.sim) {                                   // built-in test signal (window.__orb.simMusic)
    music.simT += dt;
    const t = music.simT, beatLen = 60 / 118, ph = fract(t / beatLen), bar = Math.floor(t / (beatLen * 4)) % 12, hard = bar >= 5;
    const kick = Math.exp(-ph * (hard ? 9 : 14)) * (hard ? 1 : 0.35);
    const snare = hard ? Math.exp(-fract(t / beatLen / 2 + 0.5) * 12) * 0.7 : 0;
    const hat = Math.exp(-fract(t / beatLen * 2) * 18) * (hard ? 0.6 : 0.25);
    for (let k = 0; k < BANDS; k++) {
      const x = k / BANDS;
      let v = kick * 1.2 * Math.exp(-x * 6) + snare * Math.exp(-Math.pow((x - 0.45) * 5, 2)) + hat * Math.pow(x, 1.5)
            + (hard ? 0.42 : 0.14) * (0.5 + 0.5 * Math.sin(t * 1.3 + k * 0.4)) * Math.exp(-Math.pow((x - 0.3) * 2.2, 2))
            + (hard ? 0.5 * Math.exp(-x * 4) : 0);
      v = clamp(v * (0.8 + 0.2 * Math.random()), 0, 1);
      b[k] = v > b[k] ? v : approach(b[k], v, 7, dt);
    }
    for (let k = 0; k < 128; k++) music.wave[k] = Math.sin(k * 0.3 + t * 9) * (0.2 + kick * 0.6) + Math.sin(k * 1.1 - t * 5) * 0.15;
    live = true;
  } else {
    for (let k = 0; k < BANDS; k++) b[k] = approach(b[k], 0, 3, dt);
    for (let k = 0; k < 128; k++) music.wave[k] = approach(music.wave[k], 0, 3, dt);
  }
  let e = 0, bass = 0;
  for (let k = 0; k < BANDS; k++) { e += b[k]; if (k < 6) bass += b[k]; }
  music.energy = e / BANDS; music.bass = bass / 6;
  music.bassAvg = approach(music.bassAvg, music.bass, 1.5, dt);
  music.energyAvg = approach(music.energyAvg, music.energy, 0.35, dt);
  music.bassSlow = approach(music.bassSlow, music.bass, 0.5, dt);
  music.intensity = 0.5 * music.energyAvg + 0.5 * music.bassSlow;
  if (live && music.bass > 0.3 && music.bass - music.bassAvg > 0.1 && sim.time - music.lastBeat > 0.26) {
    const gap = sim.time - music.lastBeat;
    if (gap > 0.3 && gap < 1.25) music.period = music.period ? lerp(music.period, gap, 0.25) : gap;   // for the heart's beat
    music.lastBeat = sim.time; music.beat = 1;
  }
  music.beat *= Math.exp(-dt * 7);
  if (music.sim) {                                          // test signal: decide from the sound itself
    const on = music.energy > 0.04;
    music.activeFor = on ? music.activeFor + dt : 0;
    music.active = music.activeFor > 0.4;
  } else {
    // music_listener.py already waits ~2 s before saying "music" and ~2.5 s of quiet before "stopped",
    // so a pause inside a song or the gap between two tracks doesn't end the dance.
    music.active = live;
    music.activeFor = live ? music.activeFor + dt : 0;
  }
  if (!music.active && sim.time - music.lastBeat > 4) music.period = 0;
}
// ================================================================ forms
const forms = {};
function makeForm(id, label, opts) {
  const f = Object.assign({
    id, label, ready: false, moodWeight: 0.15, center: [0, 0, 0], focus: [0, 0, 0], glow: 0.14,
    palette: [[0.1, 0.2, 0.6], [0.4, 0.8, 1.0], [0.9, 1.0, 1.0]],
    init() {}, update() {}, act() { return null; },
  }, opts);
  f.x = new Float32Array(N); f.y = new Float32Array(N); f.z = new Float32Array(N);
  f.tone = new Float32Array(N); f.bright = new Float32Array(N);
  forms[id] = f;
  return f;
}
function ensure(f) { if (!f.ready) { f.init(); f.ready = true; } return f; }

// ---------------------------------------------------------------- ORB (her normal form)
makeForm('orb', 'Orb', {
  moodWeight: 1, glow: 0.22,
  init() {
    this.k = new Uint8Array(N); this.A = new Float32Array(N); this.B = new Float32Array(N); this.C = new Float32Array(N);
    const [nShell, nCore, nRing, nStream, nSat] = counts([0.44, 0.1, 0.2, 0.12, 0.04, 0.1]);
    let i = 0;
    for (let j = 0; j < nShell; j++, i++) { this.k[i] = 0; this.A[i] = Math.acos(1 - 2 * (j + 0.5) / nShell); this.B[i] = (j * GA) % TAU; this.C[i] = Math.random(); }
    for (let j = 0; j < nCore; j++, i++) { this.k[i] = 1; this.A[i] = Math.acos(2 * Math.random() - 1); this.B[i] = Math.random() * TAU; this.C[i] = Math.abs(gauss()) * 0.55; }
    for (let j = 0; j < nRing; j++, i++) { this.k[i] = 2; this.A[i] = Math.random() * TAU; this.B[i] = gauss(); this.C[i] = j % 3; }
    for (let j = 0; j < nStream; j++, i++) { this.k[i] = 3; this.A[i] = Math.random(); this.B[i] = j % 14; this.C[i] = gauss(); }
    for (let j = 0; j < nSat; j++, i++) { this.k[i] = 4; this.A[i] = j % 5; this.B[i] = Math.acos(2 * Math.random() - 1); this.C[i] = Math.random() * TAU; }
    for (; i < N; i++) { this.k[i] = 5; this.A[i] = Math.acos(2 * Math.random() - 1); this.B[i] = Math.random() * TAU; this.C[i] = Math.random(); }
    this.rings = [[0.35, 0.25], [1.2, -0.7], [-0.95, 1.05]].map(([ax, az]) => {
      const m = rotMat(0, ax, az);
      const n = [m[1], m[4], m[7]], u = [m[0], m[3], m[6]], v = cross(n, u);
      return { n, u, v };
    });
    this.streams = Array.from({ length: 14 }, (_, j) => { const y = 1 - 2 * (j + 0.5) / 14, r = Math.sqrt(1 - y * y), p = j * GA; return [Math.cos(p) * r, y, Math.sin(p) * r]; });

  update(t, dt, S) {

makeForm('butterfly', 'Butterfly', {

// ---------------------------------------------------------------- HEART
makeForm('heart', 'Heart', {
  palette: [[0.5, 0.02, 0.16], [1.0, 0.24, 0.45], [1.0, 0.82, 0.9]], glow: 0.18,
  init() {
    const kind = this.kind = new Uint8Array(N), P = this.P = new Float32Array(N * 3);
    const TN = this.tone, BR = this.bright;
    const F = (x, y, z) => Math.pow(x * x + 2.25 * z * z + y * y - 1, 3) - x * x * y * y * y - 0.1125 * z * z * y * y * y;
    const c = counts([0.62, 0.2, 0.18]);
    let i = 0;
    const surf = [];
    for (let j = 0; j < c[0] + c[1]; j++) {
      const d = norm3([gauss(), gauss(), gauss()]);
      let lo = 0, hi = 2;
      for (let s = 0; s < 22; s++) { const m = (lo + hi) / 2; if (F(d[0] * m, d[1] * m, d[2] * m) < 0) lo = m; else hi = m; }
      surf.push([d[0] * lo, d[1] * lo, d[2] * lo]);
    }
    for (let j = 0; j < c[0]; j++, i++) { const p = surf[j]; kind[i] = 0; P[i * 3] = p[0]; P[i * 3 + 1] = p[1]; P[i * 3 + 2] = p[2]; TN[i] = 0.35 + 0.35 * (p[1] + 1.2) / 2.4; BR[i] = 1.1; }
    for (let j = 0; j < c[1]; j++, i++) { const p = surf[c[0] + j], s = Math.cbrt(Math.random()) * 0.85; kind[i] = 1; P[i * 3] = p[0] * s; P[i * 3 + 1] = p[1] * s; P[i * 3 + 2] = p[2] * s; TN[i] = 0.9; BR[i] = 0.45; }
    for (; i < N; i++) { kind[i] = 2; P[i * 3] = Math.random() * TAU; P[i * 3 + 1] = Math.random(); P[i * 3 + 2] = 0.9 + Math.random() * 0.8; TN[i] = 0.95; BR[i] = 0.5; }
    this.lastBeat = -1;
  },
  update(t, dt, S) {
    const X = this.x, Y = this.y, Z = this.z, BR = this.bright, kind = this.kind, P = this.P;
    const period = S.music > 0.5 ? clamp(music.period || 60 / 118, 0.35, 1.2) : 0.9;   // beats with the song
    const ph = fract(t / period);
    const pulse = Math.exp(-Math.pow(ph / 0.06, 2)) + 0.6 * Math.exp(-Math.pow((ph - 0.24) / 0.07, 2));
    const sc = 0.4 * (1 + 0.1 * pulse + 0.06 * S.level);

        X[i] = Math.cos(a) * r; Y[i] = (u * 2 - 1) * 0.9; Z[i] = Math.sin(a) * r; BR[i] = 0.5 * Math.sin(Math.PI * u);
      }
    }
    applyMat(this, rotMat(0.45 * Math.sin(t * 0.5), 0.12, 0), 1, 0, 0.05, 0);

});

  } else if (k === 'music') {
    const art = d.art ? `<img alt="" src="${esc(d.art)}">` : '<span class="ic">🎵</span>';
    c.el.innerHTML = `${art}<div class="main"><div class="t1">${esc(d.title)}</div><div class="t2">${esc(d.artist)}</div></div><span class="ic">${d.playing ? '▶️' : '⏸️'}</span><div class="bar"><i></i></div>`;
  } else if (k === 'weather') {

    const cond = String(d.cond || ''), cap = cond.charAt(0).toUpperCase() + cond.slice(1);
    c.el.innerHTML = `<span class="ic" style="font-size:28px;width:32px">${esc(d.icon || '🌡️')}</span><span class="big">${d.temp != null ? esc(d.temp) + '°' : ''}</span><div class="main"><div class="t1">${esc(cap)}${d.place ? ' · ' + esc(d.place) : ''}</div><div class="t2">${esc(bits)}</div></div>`;
  } else if (k === 'hold') {                // a gesture being held (gestures.py): the bar fills, drop your hand to cancel
    c.el.innerHTML = `<span class="ic">${esc(d.icon || '✋')}</span><div class="main"><div class="t1">${esc(d.text || '')}</div></div><div class="bar"><i></i></div>`;
  } else if (k === 'note') {

  } else {
    c.el.innerHTML = `<span class="ic">${esc(d.icon || '•')}</span><div class="main"><div class="t1" style="font-weight:500">${esc(d.text || '')}</div></div>`;

// ---------------------------------------------------------------- the glass pills behind the cards
// One canvas at screen resolution. Each pill: a dark glass gradient, a glow of the card's accent colour
// behind its icon, a hairline highlight along the top and a fine border. In the see-through window the
// finished pixels are snapped to fully drawn / fully clear, so the rounded outline never blends.
const cardBg = document.getElementById('cardbg');
const ACCENTS = { weather: [255, 190, 84], music: [30, 215, 96], timer: [96, 200, 255], note: [178, 140, 255],
                  status: [140, 164, 230], hold: [120, 214, 255], done: [110, 220, 110] };

  g.lineTo(x + r, y + h); g.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);

}
function paintCards() {

  if (cardBg.width !== W || cardBg.height !== H) { cardBg.width = W; cardBg.height = H; }
  const g = cardBg.getContext('2d', { willReadFrequently: true });
  g.clearRect(0, 0, W, H);
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (const c of cardMap.values()) {
    if (c.el.style.display === 'none' || !c.el.style.width) continue;
    const x = Math.round(parseFloat(c.el.style.left) * dpr), y = Math.round(parseFloat(c.el.style.top) * dpr);
    const w = Math.round(parseFloat(c.el.style.width) * dpr), h = Math.round(parseFloat(c.el.style.height) * dpr);
    const r = Math.min(h / 2, 16 * dpr), [ar, ag, ab] = c.accent || ACCENTS.status;
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h);

    fill.addColorStop(0, '#1b2743'); fill.addColorStop(0.55, '#121a30'); fill.addColorStop(1, '#0c1224');

    glow.addColorStop(0, `rgba(${ar},${ag},${ab},0.26)`); glow.addColorStop(1, `rgba(${ar},${ag},${ab},0)`);
    g.fillStyle = glow; g.fillRect(x, y, w, h);
    const sheen = g.createLinearGradient(0, y, 0, y + h * 0.5);         // glass: lighter near the top
    sheen.addColorStop(0, 'rgba(255,255,255,0.07)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sheen; g.fillRect(x, y, w, h * 0.5);

    pillPath(g, x + 0.5, y + 0.5, w - 1, h - 1, Math.max(1, r - 0.5));
    const edge = g.createLinearGradient(0, y, 0, y + h);
    edge.addColorStop(0, `rgba(${Math.round(ar * 0.35 + 150)},${Math.round(ag * 0.35 + 165)},${Math.round(ab * 0.35 + 200)},0.55)`);

    const img = g.getImageData(bx, by, bw, bh), px = img.data;

}

function upsertCard(d) {
  if (!d || typeof d !== 'object' || !d.id || !CARD_H[d.kind]) return;
  let c = cardMap.get(d.id);
  if (!c) { c = { el: document.createElement('div'), born: performance.now() }; cardsEl.appendChild(c.el); cardMap.set(d.id, c); }
  if (d.ttl && !d.until) d.until = Date.now() + d.ttl * 1000;     // (avatar_server.py sets "until" itself)
  c.data = d;

}
function removeCard(id) {
  const c = cardMap.get(id);
  if (!c) return;
  c.el.remove(); cardMap.delete(id);
  layoutCards();
}

// Bottom-up stack, newest pop-ups first. Everything is a multiple of 4 CSS px.
function layoutCards() {
  const q4 = v => Math.floor(v / 4) * 4;
  const W = q4(innerWidth - 16);
  const list = [...cardMap.values()].sort((a, b) => (CARD_ORDER[a.data.kind] - CARD_ORDER[b.data.kind]) || (b.born - a.born));
  let y = q4(innerHeight) - 8, used = 0;
  list.forEach((c, i) => {
    if (i >= MAX_CARDS) { c.el.style.display = 'none'; return; }
    const h = CARD_H[c.data.kind];
    y -= h;
    Object.assign(c.el.style, { display: 'flex', left: '8px', top: y + 'px', width: W + 'px', height: h + 'px' });
    y -= 8; used += h + 8;
  });
  layout.target = used ? Math.min(0.55, (used + 8) / Math.max(1, innerHeight)) : 0;
  paintCards();
}
addEventListener('resize', layoutCards);

// Live parts: countdowns, song progress, expiry. Text is only touched when it changes.
function updateCards(dt) {
  layout.frac = approach(layout.frac, layout.target, 5, dt);
  if (Math.abs(layout.frac - layout.target) < 1e-3) layout.frac = layout.target;
  if (!cardMap.size) return;
  const now = Date.now();
  for (const [id, c] of cardMap) {
    const d = c.data;
    if (d.until && now > d.until) { removeCard(id); continue; }
    if (d.kind === 'timer') {
      const left = d.done ? 0 : Math.max(0, (d.due - now) / 1000);
      const text = mmss(left);
      if (text !== c.lastText) { c.big.textContent = text; c.lastText = text; }
      if (c.bar) c.bar.style.width = (100 * (1 - left / Math.max(1, d.total))).toFixed(1) + '%';
    } else if (d.kind === 'hold' && c.bar) {
      const f = d.total > 0 ? clamp((now - (d.start || now)) / (d.total * 1000), 0, 1) : 0;
      c.bar.style.width = (100 * f).toFixed(1) + '%';
    } else if (d.kind === 'music' && c.bar) {
      const pos = d.duration ? Math.min(d.duration, d.progress + (d.playing ? now - d.at : 0)) : 0;
      c.bar.style.width = d.duration ? (100 * pos / d.duration).toFixed(1) + '%' : '0%';
    }

}

// ================================================================ the universe's names and symbols (on top of the particles)
// Text can't be particles: a 2D canvas over the scene, drawn only where the glass (or the dark tile) is
// fully drawn - in the see-through window a soft text edge over a see-through pixel would show the key
// colour, so everything is clipped to the inside of the sphere.
const lab = document.getElementById('ulabels');
const LABEL_FONT = '"Bahnschrift", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';
const GLYPH_FONT = '"Yu Gothic UI", "Yu Gothic", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK JP", "Noto Sans CJK SC", sans-serif';
let labAlpha = 0, labWasDrawn = false;

// world (a form's output) -> window pixels, exactly as the vertex shader and the glass lens place it
function toScreen(p, K, W, H) {
  const persp = 3.4 / (3.4 - p[2]);
  const nx = p[0] * persp * K[0], ny = p[1] * persp * K[1] + K[2];
  let sx = (nx * 0.5 + 0.5) * W, sy = (ny * 0.5 + 0.5) * H;          // (y up, like the GL pixels)
  if (SPHERE) {
    const cx = (sphere.cx * 0.5 + 0.5) * W, cy = (sphere.cy * 0.5 + 0.5) * H, r = sphere.r || 1;
    const qx = (sx - cx) / r, qy = (sy - cy) / r, qs = Math.hypot(qx, qy);
    if (qs >= 0.84) return null;                                      // outside what the glass shows
    let lo = 0, hi = 1;                                               // the lens: |d| (0.84 + 0.16 sqrt(1 - d^2)) = |q|
    for (let it = 0; it < 14; it++) { const m = (lo + hi) / 2; if (m * (0.84 + 0.16 * Math.sqrt(1 - m * m)) < qs) lo = m; else hi = m; }

}

  g.lineWidth = Math.max(1, R * 0.03);

  for (let i = 0; i < 48; i++) {                                     // the dial's ticks
    const an = i / 48 * TAU - Math.PI / 2 + sim.time * 0.05, long = i % 6 === 0;
    const r0 = R * 1.1, r1 = R * (long ? 1.26 : 1.17);

function stepLabels(dt) {
  labAlpha = approach(labAlpha, trans.to.id === 'universe' && trans.p > 0.55 ? 1 : 0, 4, dt);
  if (labAlpha < 0.005) labAlpha = 0;
}
function drawLabels() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.width, H = canvas.height;
  if (lab.width !== W || lab.height !== H) { lab.width = W; lab.height = H; }
  const g = lab.getContext('2d');
  if (labAlpha < 0.01 || !(SPHERE || OPAQUE) || !forms.universe.ready) {
    if (labWasDrawn) { g.clearRect(0, 0, W, H); labWasDrawn = false; }
    return;
  }
  labWasDrawn = true;
  g.clearRect(0, 0, W, H);
  const K = frameScale(W, H, layout.frac, dpr), U = forms.universe, an = U.anchors;
  const R = SPHERE ? sphere.r : Math.min(W, H) * 0.45;
  const cx = SPHERE ? (sphere.cx * 0.5 + 0.5) * W : W / 2, cy = SPHERE ? H - (sphere.cy * 0.5 + 0.5) * H : H / 2;
  g.save();

  g.textAlign = 'center'; g.textBaseline = 'top';
  // --- the whole universe: each galaxy's name and title, the Nexus in the middle
  const over = A * (1 - smooth(0.15, 0.6, F));
  if (over > 0.01) {
    const all = [[an.nexus, UNI.nexus, 0.1]].concat(UNI.beings.map((b, q) => [an.gal[q], b, 0.07]));
    const roomy = R >= 330 * dpr;                                     // big enough for the small titles too
    for (const [p, b, off] of all) {
      if (!b || !p) continue;
      const s = toScreen(p, K, W, H);
      if (!s) continue;
      const y = s[1] + R * off * (an.zoom || 1) * s[2];
      g.globalAlpha = over;
      g.font = `600 ${px(b.key === 'nexus' ? 0.066 : 0.058)}px ${LABEL_FONT}`;
      g.fillStyle = rgba(b.color, 1); g.shadowColor = b.color; g.shadowBlur = R * 0.03;
      spaced(g, b.name.toUpperCase(), s[0], y, px(0.004));
      if (roomy || b.key === 'nexus') {
        g.shadowBlur = 0; g.globalAlpha = over * 0.75;
        g.font = `500 ${px(roomy ? 0.03 : 0.036)}px ${LABEL_FONT}`; g.fillStyle = '#aeb8d8';
        spaced(g, (b.title || '').toUpperCase(), s[0], y + px(b.key === 'nexus' ? 0.075 : 0.066), px(0.004));
      }

  if (b && inA > 0.01) {
    const ey = cy - R * 0.62, eR = R * 0.16;
    drawEmblem(g, cx, ey, eR, b, inA);
    g.globalAlpha = inA; g.textBaseline = 'top';
    g.font = `600 ${px(0.075)}px ${LABEL_FONT}`; g.fillStyle = rgba(b.color, 1); g.shadowColor = b.color; g.shadowBlur = R * 0.04;
    spaced(g, b.name.toUpperCase(), cx, ey + eR * 1.45, px(0.014));
    g.shadowBlur = 0; g.globalAlpha = inA * 0.8; g.fillStyle = '#b8c2e0';
    g.font = `500 ${px(0.032)}px ${LABEL_FONT}`;
    spaced(g, b.title.toUpperCase(), cx, ey + eR * 1.45 + px(0.092), px(0.005));
    g.font = `500 ${px(0.042)}px ${LABEL_FONT}`; g.textBaseline = 'top';
    b.helpers.forEach((name, h) => {
      const p = an.helpCam && an.helpCam[q * 6 + h];
      if (!p) return;
      const s = toScreen(p, K, W, H);
      if (!s) return;
      g.globalAlpha = inA * 0.95; g.fillStyle = '#e8eeff'; g.shadowColor = b.color; g.shadowBlur = R * 0.02;
      g.fillText(name, s[0], s[1] + px(0.03));
    });
  }
  g.restore();
}

// ================================================================ forms and actions asked for by voice (avatar_forms.py)
const FORM_IDS = ['orb', 'dragon', 'sword', 'knight', 'butterfly', 'planet', 'heart', 'galaxy', 'universe'];
const MUSIC_FORMS = ['pulse', 'eqring', 'waves'];
// which form performs which action
const ACTION_FORM = { roar: 'dragon', fire: 'dragon', fly: 'dragon', stay: 'dragon', swing: 'sword', attack: 'knight', block: 'knight', raise: 'knight' };
let actQueue = [], lastActAt = -9;   // actions waiting for their form to assemble / for the previous one
let musicMode = false, musicForm = null, musicFormSince = 0, musicHold = false, formBeforeMusic = 'orb';

function askForm(id, replay) {
  if (!FORM_IDS.includes(id)) return false;
  if (replay) {                                   // catching up after a reconnect: not a new request
    if (musicMode) { formBeforeMusic = id; return true; }
    if (trans.to.id === id) return true;
  }
  if (music.active) musicHold = true;             // she keeps the beat in whatever you asked for
  if (id === 'dragon' && trans.to.id !== 'dragon' && forms.dragon.ready) forms.dragon.flyTarget = 0;
  actQueue = [];
  formBeforeMusic = id;
  setForm(id);
  return true;
}
function askAction(name) {
  let form = ACTION_FORM[name];
  if (!form) return false;
  const target = actQueue.length ? actQueue[actQueue.length - 1].form : trans.to.id;
  // "attack" as a sword is a swing; "swing" as a knight is an attack
  if (name === 'attack' && target === 'sword') { form = 'sword'; name = 'swing'; }
  else if (name === 'swing' && target === 'knight') { form = 'knight'; name = 'attack'; }
  if (music.active) musicHold = true;
  formBeforeMusic = form;
  if (trans.to.id !== form) { setForm(form); actQueue = actQueue.filter(a => a.form === form); }
  const assembled = sim.time + Math.max(0, (0.8 - trans.p) * 1.9);
  const prev = actQueue.length ? actQueue[actQueue.length - 1].at : lastActAt;
  const at = Math.max(assembled, prev + 1.3);       // "roar and breathe fire": one after the other
  if (at <= sim.time) { ensure(forms[form]).act(name); lastActAt = sim.time; }
  else actQueue.push({ form, name, at });
  return true;
}
function runPending() {
  while (actQueue.length && sim.time >= actQueue[0].at) {
    const a = actQueue.shift();
    if (trans.to.id === a.form) { forms[a.form].act(a.name); lastActAt = sim.time; }
  }
}
function directMusic() {
  if (!music.active) {
    if (musicMode) {
      musicMode = false; musicForm = null;
      if (MUSIC_FORMS.includes(trans.to.id)) setForm(FORM_IDS.includes(formBeforeMusic) ? formBeforeMusic : 'orb');
    }
    musicHold = false;
    return;
  }
  if (!musicMode) {
    musicMode = true; musicFormSince = -99;
    if (!MUSIC_FORMS.includes(trans.to.id)) formBeforeMusic = trans.to.id;
  }
  if (musicHold) return;
  const e = music.intensity;
  let want = e > 0.4 ? 'pulse' : e > 0.22 ? 'eqring' : 'waves';     // hard -> spiky pulse, medium -> ring, calm -> waves
  if (musicForm && musicForm !== want && sim.time - musicFormSince < 6) want = musicForm;
  if (want !== musicForm || trans.to.id !== want) { musicForm = want; musicFormSince = sim.time; setForm(want); }
}

// ================================================================ messages from avatar_server.py
function handle(msg) {
  if (!msg || typeof msg !== 'object') return;
  const type = msg.type || (msg.viseme ? 'viseme' : msg.state ? 'state' : msg.emotion ? 'emotion' : null);
  switch (type) {
    case 'state': setRawState(msg.state || msg.value); break;
    case 'speech_start': setRawState('speaking'); break;
    case 'speech_end': setRawState(msg.next || 'idle'); voice.tl = []; break;
    case 'emotion': setMood(msg.emotion || msg.name || msg.value, msg.intensity); break;
    case 'visemes': setTimeline(msg.sequence || msg.visemes || []); break;
    case 'viseme': {
      const d = +(msg.duration ?? msg.d ?? 0.09);
      const rel = sim.time - voice.t0;
      if (!voice.tl.length || rel > voice.end + 0.25) setTimeline([{ v: msg.viseme || msg.value, t: 0, d, w: msg.weight ?? 1 }]);
      else { voice.tl.push({ t: rel, d: clamp(d, 0.03, 0.6), p: (VOWEL_OPEN[msg.viseme || msg.value] || 0.6) * clamp(+(msg.weight ?? 1) || 1, 0, 1.4) }); voice.end = Math.max(voice.end, rel + d); }
      break;
    }
    case 'level': voice.ext = Math.max(voice.ext, clamp(+(msg.value ?? 0) || 0, 0, 1)); break;
    case 'form': askForm(String(msg.name || msg.form || msg.value || '').toLowerCase(), !!msg.replay); break;
    case 'action': askAction(String(msg.name || msg.action || msg.value || '').toLowerCase()); break;
    case 'music': onMusic(msg); break;
    case 'universe': onUniverse(msg); break;
    case 'card': upsertCard(msg.card); break;
    case 'card_remove': removeCard(String(msg.id || '')); break;
    case 'cards_clear': [...cardMap.keys()].forEach(removeCard); break;
    case 'dance':                                         // "dance" / "stop dancing"
      music.react = msg.on !== false;
      if (music.react) { musicHold = false; }
      else { music.on = false; music.bytes.fill(0); }
      break;
    case 'gesture':                                       // initiative.py's little idle gestures -> a soft ripple
      if (sim.awake > 0.5 && trans.to.id === 'orb' && sim.time - sim.lastRing > 1) { sim.lastRing = sim.time; addRing(trans.to.focus, 0.35); }
      break;
    default: break;                                       // blink / framing / config: nothing to do for an orb
  }
}

// ================================================================ main loop
const S = { level: 0, user: 0, think: 0, awake: 0, beat: 0, music: 0, bandAt };
function tick(dt) {
  sim.time += dt;
  if (sim.raw === 'idle' && sim.state !== 'asleep' && sim.time >= sim.sleepAt) sim.state = 'asleep';
  // emotions fade back to her own colour a while after she has finished talking
  if (sim.mood !== 'neutral' && sim.state !== 'speaking' && sim.time - sim.moodAt > 8) { sim.mood = 'neutral'; sim.moodK = 1; }

  stepVoice(dt, peak => {
    if (peak > 0.62 && sim.time - sim.lastRing > 0.3 && trans.to.id === 'orb') { sim.lastRing = sim.time; addRing(trans.to.focus, peak * 0.8); }
  });
  sim.rings.forEach(r => { r.r += dt * 1.1 * MOTION; r.a *= Math.exp(-dt * 1.1); });
  sim.rings = sim.rings.filter(r => r.r < 2.8 && r.a > 0.02);

  analyseMusic(dt);
  directMusic();
  runPending();

  const awakeTarget = Math.max(sim.state === 'asleep' ? 0 : 1, music.active ? 0.85 : 0);   // she dances even while asleep
  sim.awake = approach(sim.awake, awakeTarget, 1.8, dt);
  sim.think = approach(sim.think, sim.state === 'thinking' ? 1 : 0, 3.2, dt);
  S.level = voice.level; S.think = sim.think; S.awake = sim.awake;
  S.user = sim.state === 'listening' ? 0.16 + 0.1 * Math.sin(sim.time * 1.7) : 0;         // a quiet attentive shimmer
  S.beat = music.beat * (musicMode || music.active ? 1 : 0);
  S.music = music.active ? 1 : 0;

  // palette: the form's colours, tinted by her mood (fully, for the orb), by thinking and by sleep
  const f = trans.to, mood = mix3(MOODS.neutral, MOODS[sim.mood], sim.moodK);
  const moodPal = [mood.map(v => v * 0.28 + 0.02), mood, mix3(mood, [1, 1, 1], 0.62)];
  for (let k = 0; k < 3; k++) {
    let target = mix3(f.palette[k], moodPal[k], f.moodWeight);
    target = mix3(target, k === 0 ? THINK_RGB.map(v => v * 0.3) : THINK_RGB, 0.55 * sim.think * (f.id === 'orb' ? 1 : 0.4));
    if (sim.state === 'asleep' && !music.active) target = mix3(target, [0.45, 0.52, 0.85].map(v => v * (k === 0 ? 0.3 : 1)), 0.45);
    palette[k] = mix3(palette[k], target, 1 - Math.exp(-3 * dt));
  }
  compose(sim.time, dt, S);
}

// Asleep and quiet she only needs ~24 frames a second (most of the day: saves CPU); awake, dancing or
// changing shape she gets every frame the screen shows.
function wantedFps() { return (sim.awake < 0.08 && !music.active && trans.p >= 1 && !sim.rings.length && layout.frac === layout.target) ? 24 : 0; }
let last = performance.now(), lastDrawn = 0, frames = 0, fpsT = 0, fps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const cap = wantedFps();
  if (cap && now - lastDrawn < 1000 / cap - 2) return;
  lastDrawn = now;
  const dt = clamp((now - last) / 1000, 0, 0.05);   // rAF's first timestamp can be earlier than performance.now()
  last = now;
  try { updateCards(dt); tick(dt); stepLabels(dt); draw(dt, S); drawLabels(); } catch (e) { console.error('[orb]', e); }
  frames++; fpsT += dt; if (fpsT >= 1) { fps = frames / fpsT; frames = 0; fpsT = 0; }
}
compose(0, 0.016, S);
requestAnimationFrame(frame);

// ================================================================ websocket to avatar_server.py
let ws = null, reconnectTimer = null, linkUp = false;
function connect() {
  clearTimeout(reconnectTimer);
  try { ws = new WebSocket(WS_URL); } catch (e) { scheduleReconnect(); return; }
  ws.onopen = () => { linkUp = true; try { ws.send(JSON.stringify({ type: 'hello', client: 'avatar', style: 'orb', ready: true })); } catch (e) {} };
  ws.onclose = () => { linkUp = false; scheduleReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    try { handle(msg); } catch (e) { console.error('[orb] message failed', msg, e); }
  };
}
function scheduleReconnect() { clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connect, 1500); }
if (PARAMS.get('ws') !== 'off') connect();

// ================================================================ Ctrl + mouse wheel over her: bigger / smaller
// avatar_window.py resizes the window around her centre and remembers it (avatar_place.py).
let wheelSteps = 0, wheelTimer = 0;
addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();                        // never the browser's page zoom
  wheelSteps += e.deltaY < 0 ? 1 : e.deltaY > 0 ? -1 : 0;
  if (wheelTimer) return;
  wheelTimer = setTimeout(() => {
    const steps = Math.max(-6, Math.min(6, wheelSteps));
    wheelSteps = 0; wheelTimer = 0;
    const api = window.pywebview && window.pywebview.api;
    if (steps && api && typeof api.scale === 'function') {
      try { Promise.resolve(api.scale(Math.pow(1.08, steps))).catch(() => {}); } catch (err) {}
    }
  }, 90);
}, { passive: false });

// ================================================================ for tests and tuning (browser console)
window.__orb = {
  handle, sim, forms, trans, music, voice, S, look, layout, cards: cardMap,
  form: () => trans.to.id,
  state: () => ({ state: sim.state, raw: sim.raw, mood: sim.mood, form: trans.to.id, p: trans.p, music: music.active, musicMode, musicHold, fps, link: linkUp, n: N, opaque: OPAQUE }),
  advance: s => { for (let t = 0; t < s; t += 1 / 30) { updateCards(1 / 30); tick(1 / 30); stepLabels(1 / 30); } },
  render: () => { draw(1 / 60, S); drawLabels(); },
  universe: UNI, onUniverse,
  simMusic: on => { music.sim = !!on; music.simT = 0; },
  setTrails: on => { trails = !!on; },
};
})();
</script>
